<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2f5bea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Карточки: английский и словацкий</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#d5dce8;--acc:#2f5bea;--acc-ink:#fff;--en:#2f5bea;--sk:#c8372d;--ok:#1f8a5b;--warn:#a86a00;--bad:#c8372d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#e8edf7;--mute:#97a6c2;--line:#2b3957;--acc:#6f93ff;--acc-ink:#0f1626;--en:#6f93ff;--sk:#ff7b70;--ok:#4cc38a;--warn:#f0b254;--bad:#ff7b70}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#e8edf7;--mute:#97a6c2;--line:#2b3957;--acc:#6f93ff;--acc-ink:#0f1626;--en:#6f93ff;--sk:#ff7b70;--ok:#4cc38a;--warn:#f0b254;--bad:#ff7b70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:24px 0 4px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.due{color:var(--mute);font-size:14px}
nav,.chips{display:flex;gap:6px;margin-bottom:10px}
nav button,.chips button{flex:1;padding:10px 4px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on,.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,textarea:focus-visible,select:focus-visible,.in:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center}
.tag{font-size:13px;font-weight:700}
.tag.en{color:var(--en)}.tag.sk{color:var(--sk)}
.front{font-size:32px;font-weight:700;margin:18px 0 8px;overflow-wrap:anywhere}
.back{font-size:26px;font-weight:700;margin:14px 0 6px;padding-top:16px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.emo{font-size:64px;line-height:1.2;margin:8px 0}
img.pic{display:block;margin:8px auto;max-width:100%;max-height:200px;border-radius:12px}
.nt{white-space:pre-line;text-align:left;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--mute);margin-top:10px}
.res{font-weight:700;margin-top:14px}
.res.ok{color:var(--ok)}.res.near{color:var(--warn)}.res.bad{color:var(--bad)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades button{padding:10px 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.grades button.sug{border:2px solid var(--acc)}
.grades small{display:block;color:var(--mute);font-size:12px}
.say{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
textarea,select,.in{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-top:12px}
.lbl+.in,.lbl+select,.lbl+textarea{margin-top:4px}
textarea{min-height:90px}
.lbl{display:block;font-size:14px;color:var(--mute);margin-top:12px}
details{margin-top:20px}summary{cursor:pointer;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .m{flex:1;min-width:0;overflow-wrap:anywhere}
.row small{color:var(--mute);display:block}
.row button{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.th{width:40px;height:40px;border-radius:8px;object-fit:cover;font-size:28px;text-align:center;line-height:40px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:22px;font-weight:700}
.stats small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.note{color:var(--mute);font-size:14px;margin:8px 0}
.empty{padding:36px 8px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pg>div,.opts{display:grid;gap:8px;align-content:start}.opts{margin:12px 0}
.opt{padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;overflow-wrap:anywhere}
.opt.sel{border:2px solid var(--acc)}.opt.good{border:2px solid var(--ok)}.opt.bad{border:2px solid var(--bad)}
.lts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.lt{min-width:44px;height:48px;font-size:20px;padding:0 10px}
.slots{font-size:28px;font-weight:700;margin:12px 0;min-height:40px}
</style>
</head>
<body>
<main>
<header><h1>Карточки</h1><span class="due" id="due"></span></header>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
var KEY='lc_v1',S,tab='study',lang='all',cur=null,res=null,ed=null,pimg='',foc=false,LN={en:'English',sk:'Slovenčina'};
var SEED=[
['en','although','хотя','Although it was late, we kept talking. После although идёт целое предложение, «but» не нужен.','🌦️'],
['en','however','однако','I like it. However, it’s too expensive. Обычно в начале предложения, после него запятая.','🔀'],
['en','to improve','улучшать','improve your English; room for improvement — есть куда расти.','📈'],
['en','enough','достаточно','good enough — достаточно хорошо; enough is enough — хватит. Ставится после прилагательного: big enough.','✅'],
['en','to borrow','брать взаймы','Can I borrow your pen? Borrow — взять, lend — дать.','🤲'],
['en','reliable','надёжный','a reliable friend; a reliable source.','🛡️'],
['en','to achieve','достигать','achieve a goal; achieve success.','🏆'],
['en','neighbour','сосед','next-door neighbour — сосед по дому.','🏘️'],
['en','schedule','расписание','on schedule — по графику; behind schedule — с опозданием.','📅'],
['en','to suggest','предлагать','I suggest going / I suggest that we go. После suggest не используют to + инфинитив.','💡'],
['sk','ahoj','привет','Ahoj! — и «привет», и «пока» между знакомыми.','👋'],
['sk','ďakujem','спасибо','Ďakujem pekne — большое спасибо. Nie je za čo — не за что.','🙏'],
['sk','prosím','пожалуйста','Универсальное слово: «пожалуйста», «прошу» и «что, простите?» при переспросе.','🙂'],
['sk','dobrý deň','добрый день','Вежливое приветствие. Dobré ráno — доброе утро, dobrý večer — добрый вечер.','☀️'],
['sk','voda','вода','Dám si vodu. — Мне воду. Perlivá / neperlivá — с газом / без газа.','💧'],
['sk','chlieb','хлеб','Kúpim chlieb — куплю хлеб. Chlieb s maslom — хлеб с маслом.','🍞'],
['sk','Ako sa máš?','как дела?','Ответ: Mám sa dobre — у меня всё хорошо. Вежливо: Ako sa máte?','💬'],
['sk','rozumiem','я понимаю','Rozumiem vám — я вас понимаю.','🧠'],
['sk','nerozumiem','я не понимаю','Nerozumiem po slovensky — я не понимаю по-словацки.','🤷'],
['sk','Koľko to stojí?','сколько это стоит?','Platím kartou — плачу картой. Chcem zaplatiť — хочу заплатить.','🏷️'],
['sk','zajtra','завтра','Vidíme sa zajtra — увидимся завтра. Dnes — сегодня, včera — вчера.','📆']];
function mk(l,f,b,n,e,img){return{id:Date.now().toString(36)+(IDN++).toString(36)+Math.random().toString(36).slice(2,5),l:l,f:f,b:b,n:n||'',e:e||'',img:img||'',ef:2.5,reps:0,int:0,due:0}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.cards){S={cards:[],log:{}};SEED.forEach(function(p){S.cards.push(mk.apply(null,p))})}
 S.dir=S.dir||'fr';S.nw=S.nw||{};S.lim=S.lim||20;
 S.cards.forEach(function(c){if(c.n===undefined){var p=SEED.filter(function(x){return x[1]==c.f})[0];c.n=p?p[3]:'';c.e=p?p[4]:'';c.img=''}});save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Не хватило места в памяти браузера. Убери часть фото.')}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function day0(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function today(){return new Date().toISOString().slice(0,10)}
function inLang(c){return lang=='all'||c.l==lang}
function dueList(){var n=Date.now(),left=Math.max(0,(S.lim||20)-(S.nw[today()]||0));
 return S.cards.filter(function(c){return c.due>0&&c.due<=n&&inLang(c)}).sort(function(a,b){return a.due-b.due}).concat(S.cards.filter(function(c){return c.due===0&&inLang(c)}).slice(0,left))}
function nxt(c,g){
 var st=c.st||0,e0=c.ef;
 if(c.reps==0){
  if(g==0)return{ef:e0,reps:0,int:0,st:0,due:Date.now()+6e4};
  if(g==1)return{ef:e0,reps:0,int:0,st:st,due:Date.now()+(st?10:6)*6e4};
  if(g==2&&!st)return{ef:e0,reps:0,int:0,st:1,due:Date.now()+6e5};
  var j=g==3?3:1;return{ef:e0,reps:1,int:j,st:0,due:day0()+j*864e5}}
 if(g==0)return{ef:Math.max(1.3,e0-.2),reps:0,int:0,st:1,due:Date.now()+6e5};
 var q=g+2,ef=Math.max(1.3,c.ef+.1-(5-q)*(.08+(5-q)*.02)),reps=c.reps+1,i=reps==1?1:reps==2?6:Math.round(c.int*ef);
 if(g==3&&reps>1)i=Math.round(i*1.3);
 return{ef:ef,reps:reps,int:i,st:0,due:day0()+i*864e5}}
function fmt(c,g){var n=nxt(c,g);if(!n.reps)return'<'+Math.max(1,Math.round((n.due-Date.now())/6e4))+' мин.';return n.int<30?n.int+' дн.':Math.round(n.int/30)+' мес.'}
function nz(s){return s.toLowerCase().replace(/ё/g,'е').replace(/[.,!?¿;:"«»]/g,'').replace(/\s+/g,' ').trim()}
function ds(s){return nz(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function lev(a,b){var p=[],i,j,pr,t;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){pr=p[0];p[0]=i;for(j=1;j<=b.length;j++){t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,pr+(a[i-1]==b[j-1]?0:1));pr=t}}return p[b.length]}
function check(inp){
 var fr=S.dir=='fr',ex=fr?cur.b:cur.f,opts=[ex].concat(fr?ex.split(/[,;\/]/):[]),a=nz(inp);
 if(!a)return 0;
 if(opts.some(function(o){return nz(o)==a}))return 2;
 if(opts.some(function(o){var x=ds(o),y=ds(a);return x==y||(x.length>4&&lev(x,y)<=1)}))return 1;
 return 0}
function ans(){res={v:check($('ai').value),a:$('ai').value.trim()};render()}
function skip(){res={v:-1,a:''};render()}
function grade(g){if(cur.due===0)S.nw[today()]=(S.nw[today()]||0)+1;Object.assign(cur,nxt(cur,g));var t=today();S.log[t]=(S.log[t]||0)+1;save();cur=null;res=null;foc=true;render()}
function say(){var u=new SpeechSynthesisUtterance(cur.f);u.lang=cur.l=='en'?'en-GB':'sk-SK';u.rate=.9;try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function setTab(t){tab=t;cur=null;res=null;ed=null;pimg='';render()}
function setLang(l){lang=l;cur=null;res=null;render()}
function setLim(v){S.lim=+v;save();cur=null;res=null;render()}
function setDir(d){S.dir=d;save();cur=null;res=null;render()}
function edit(id){ed=id;pimg=S.cards.filter(function(c){return c.id==id})[0].img||'';tab='add';cur=null;res=null;render()}
function pick(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pimg=cv.toDataURL('image/jpeg',.7);prev()};im.src=r.result};r.readAsDataURL(f)}
function prev(){$('pv').innerHTML=pimg?'<img class="pic" alt="" src="'+pimg+'"><button class="say" onclick="pimg=\'\';prev()">Убрать фото</button>':''}
function saveCard(){var g=function(i){return $(i).value.trim()},f=g('af'),b=g('ab'),was=ed;
 if(!f||!b){$('msg').textContent='Заполни слово и перевод';return}
 if(ed){var c=S.cards.filter(function(x){return x.id==ed})[0];c.l=g('al');c.f=f;c.b=b;c.n=g('an');c.e=g('ae');c.img=pimg}
 else S.cards.push(mk(g('al'),f,b,g('an'),g('ae'),pimg));
 ed=null;pimg='';save();tab=was?'words':'add';render();if(!was)$('msg').textContent='Добавлено'}
function parse(t){
 t=t.replace(/([а-яёa-z\.\)])(?=[A-Z][A-Za-z’' ]{1,30}?\s*(?:\([^)]*\))?\s*[-–—]\s)/g,'$1\n').replace(/([а-яё\)])\s+(?=[A-Z][A-Za-z’' ]{0,30}?\s*(?:\([^)]*\))?\s+[-–—]\s)/g,'$1\n');
 var out=[],bad=0;
 t.split('\n').forEach(function(s){s=s.trim();if(!s)return;
  var ex=s.split('|'),m=ex[0].match(/^(.+?)\s*[-–—]\s+(.+)$/);
  if(!m){bad++;return}
  var f=m[1].trim(),r=m[2].trim(),pr=[],nt=ex.slice(1).map(function(x){return x.trim()}).filter(Boolean);
  f=f.replace(/\(([А-Яа-яЁё\s]+)\)/,function(_,p){pr.push(p.trim());return''}).trim();
  r=r.replace(/\s*\(([А-Яа-яЁё\s]+)\)\s*$/,function(_,p){pr.push(p.trim());return''}).trim();
  var k=r.match(/^(.*?[А-Яа-яЁё\)\.,!?])\s+([A-Za-z].*)$/);
  if(k){r=k[1];nt.unshift(k[2].trim())}
  if(pr.length)nt.unshift('Произношение: '+pr.join(', '));
  if(f&&r)out.push([f,r,nt]);else bad++});
 return{out:out,bad:bad}}
function bulk(){var l=$('al').value,p=parse($('at').value),a=0,u=0;
 p.out.forEach(function(x){var c=S.cards.filter(function(k){return k.l==l&&k.f.toLowerCase()==x[0].toLowerCase()})[0],ch=false;
  if(!c){S.cards.push(mk(l,x[0],x[1],x[2].join('\n')));a++;return}
  if(c.b.toLowerCase().indexOf(x[1].toLowerCase())<0){c.b+='; '+x[1];ch=true}
  x[2].forEach(function(z){if(c.n.indexOf(z)<0){c.n+=(c.n?'\n':'')+z;ch=true}});
  if(ch)u++});
 save();render();$('msg').textContent='Добавлено: '+a+', обновлено: '+u+(p.bad?'. Пропущено строк без « - »: '+p.bad:'')}
function del(id){S.cards=S.cards.filter(function(c){return c.id!=id});save();render()}
function exp(){$('bk').value=JSON.stringify(S)}
function imp(){try{var d=JSON.parse($('bk').value);if(d&&d.cards){S=d;S.nw=S.nw||{};S.dir=S.dir||'fr';S.lim=S.lim||20;save();render();alert('Готово')}}catch(e){alert('Не получилось прочитать данные')}}
function notif(){if(!('Notification' in window)){alert('Этот браузер не поддерживает уведомления');return}Notification.requestPermission().then(render)}
function ping(){var n=dueList().length;
 document.title=(n?'('+n+') ':'')+'Карточки';
 if(n&&'Notification' in window&&Notification.permission=='granted'){var last=0;try{last=+localStorage.getItem('lc_ping')||0}catch(e){}
  if(Date.now()-last>3*36e5){try{localStorage.setItem('lc_ping',Date.now())}catch(e){}new Notification('Пора повторять',{body:'Карточек к повторению: '+n})}}}
function chips(a,sel,fn){return'<div class="chips">'+a.map(function(p){return'<button class="'+(sel==p[0]?'on':'')+'" onclick="'+fn+'(\''+p[0]+'\')">'+p[1]+'</button>'}).join('')+'</div>'}
function pic(c,cls){return c.img?'<img class="'+(cls||'pic')+'" alt="" src="'+c.img+'">':c.e?'<div class="'+(cls?cls:'emo')+'">'+c.e+'</div>':''}
function render(){
 var d=dueList(),v=$('view'),h='';
 $('due').textContent='К повторению: '+d.length;
 $('nav').innerHTML=[['study','Учить'],['games','Практика'],['add',ed?'Изменить':'Добавить'],['words','Слова']].map(function(p){return'<button class="'+(tab==p[0]?'on':'')+'" onclick="setTab(\''+p[0]+'\')">'+p[1]+'</button>'}).join('');
 if(tab=='study'){
  h=chips([['all','Все'],['en','English'],['sk','Slovenčina']],lang,'setLang')+chips([['fr','Вспомнить перевод'],['to','Написать слово']],S.dir=='fr'?'fr':'to','setDir');
  if(!cur&&d.length)cur=d[0];
  if(!cur){var nx=S.cards.filter(function(c){return inLang(c)&&c.due>0}).map(function(c){return c.due}).sort(function(a,b){return a-b})[0],NL=S.cards.filter(function(c){return inLang(c)&&c.due===0}).length;
   h+='<div class="card empty"><div class="front">Всё повторено</div><div class="note">'+(NL?'Новые слова на сегодня закончились, в очереди ещё '+NL+'. Лимит можно поднять во вкладке «Слова».':nx?'Следующая карточка: '+new Date(nx).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'Добавь первые слова во вкладке «Добавить».')+'</div></div>'}
  else{
   var fr=S.dir=='fr',q=fr?cur.f:cur.b,ex=fr?cur.b:cur.f;
   h+='<div class="card"><span class="tag '+cur.l+'">'+LN[cur.l]+'</span><div class="front">'+esc(q)+'</div>';
   if(fr)h+='<button class="say" onclick="say()">Послушать</button>';
   if(!res){
    h+='</div><input id="ai" class="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" placeholder="'+(fr?'Перевод на русский':'Слово на '+(cur.l=='en'?'английском':'словацком'))+'" onkeydown="if(event.key===\'Enter\')ans()"><button class="btn" onclick="ans()">Проверить</button><button class="btn alt" onclick="skip()">Не помню</button>'}
   else{
    if(res.v>=0){var m=res.v==2?['ok','Верно']:res.v==1?['near','Почти, проверь написание']:['bad','Неверно'];h+='<div class="res '+m[0]+'">'+m[1]+(res.v<2&&res.a?'. Ты написал: '+esc(res.a):'')+'</div>'}
    h+='<div class="back">'+esc(ex)+'</div>'+(fr?'':'<button class="say" onclick="say()">Послушать</button>')+pic(cur)+(cur.n?'<div class="nt">'+esc(cur.n)+'</div>':'')+(hasEx(cur)?'':'<button class="say" onclick="oneEx()">Придумать примеры</button>')+'</div>';

 ai(p).then(t=>{if(G.m!='talk')return;var j=jparse(t),u=G.h[G.h.length-1];if(msg){u.fix=j.fix||'';u.why=j.why||''}
  G.h.push({r:'a',c:j.reply});(j.used||[]).forEach(w=>{var c=G.tg.find(x=>x.f.toLowerCase()==String(w).toLowerCase());if(c&&!G.used[c.id]){G.used[c.id]=1;xp(10);if(c.due<=Date.now()){if(!c.due)S.nw[today()]=(S.nw[today()]||0)+1;Object.assign(c,nxt(c,2));save()}}});G.busy=0;render()}).catch(e=>{G.err=aerr(e);G.busy=0;render()})}
function vTalk(){var h='<div class="note">Слова для разговора: '+G.tg.map(c=>(G.used[c.id]?'✓ ':'')+esc(c.f)+' — '+esc(c.b)).join(' · ')+'</div>';
 G.h.forEach((m,i)=>{h+=m.r=='a'?'<div class="card" style="text-align:left;margin-top:8px">'+esc(m.c)+' <button class="say" onclick="speak(G.h['+i+'].c,G.L)">Послушать</button></div>':'<div class="nt" style="margin-top:8px"><b>Ты:</b> '+esc(m.c)+(m.why===undefined?'':m.fix?'<br><b>Лучше:</b> '+esc(m.fix)+' <button class="say" onclick="drill('+i+')">Повторить вслух</button>':'<br>✓ Всё верно')+(m.why?'<br>'+esc(m.why):'')+(G.dr&&G.dr.i==i?'<br><i>Распознано: '+esc(G.dr.h)+'. '+(G.dr.miss.length?'Не расслышал: '+esc(G.dr.miss.join(', '))+'. Попробуй медленнее и чётче.':'Всё распознано.')+'</i>':'')+'</div>'});
 return h+(G.busy?'<div class="note">Claude пишет…</div>':'<input class="in" id="ti" value="'+esc(G.draft||'')+'" placeholder="Напиши или произнеси ответ" oninput="G.draft=this.value;G.voice=0" onkeydown="if(event.keyCode==13)tGo()"><div style="display:flex;gap:8px"><button class="btn alt" style="margin:12px 0 0" onclick="mic()">'+(G.rec?'Слушаю…':'Говорить')+'</button><button class="btn" style="margin:12px 0 0" onclick="tGo()">Отправить</button></div>')+(G.err?'<div class="res bad">'+esc(G.err)+'</div>':'')+'<div class="note">Распознавание речи — это подсказка, а не экзамен по произношению.</div><button class="btn alt" onclick="gStop()">Завершить</button>'}
function gGram(){G.rd=0;G.L=lang=='all'?'en':lang;G.tg=targets(G.L,5);G.ex=null;G.i=0;G.sc=0;G.a=null;G.busy=1;G.err='';var N=LNN[G.L],tp=shuf(GT[G.L])[0];
 var p=['Create a grammar exercise set for a Russian-speaking learner of '+N+' (level A2-B1). Grammar topic: '+tp+'.','Write 5 multiple-choice fill-in-the-blank sentences in '+N+', each using one of these target words in a correct form (each word at most once): '+G.tg.map(c=>c.f).join(', ')+'.','Each item has exactly 4 options and one correct answer. Mark the blank as ___ . Vary the position of the correct option. The tested point is the grammar topic, not the vocabulary.','Respond with ONLY a JSON object with keys: topic (topic name in Russian), rule (2-3 sentence rule in Russian), items (array of objects with keys q, opts, a as the index of the correct option, why as one short sentence in Russian).'].join('\n');
 render();ai(p).then(t=>{var j=jparse(t);if(!j.items||!j.items.length)throw 0;G.ex=j;G.busy=0;render()}).catch(e=>{G.err=aerr(e);G.busy=0;render()})}
function gG(i){if(G.a!=null)return;G.a=i;if(i==G.ex.items[G.i].a){G.sc++;xp(5)}render()}
function gNext(){G.i++;G.a=null;render()}
function vGram(){if(G.busy)return'<div class="note">Claude готовит упражнения…</div>';
 if(G.err||!G.ex)return'<div class="res bad">'+esc(G.err)+'</div><button class="btn" onclick="gStart(G.rd?6:4)">Попробовать ещё раз</button><button class="btn alt" onclick="gStop()">В меню</button>';
 var e=G.ex,it=e.items[G.i];
 if(!it)return'<div class="card"><div class="front">'+G.sc+' из '+e.items.length+'</div><div class="note">Тема: '+esc(e.topic)+'</div></div><button class="btn" onclick="gStart(G.rd?6:4)">Новые упражнения</button><button class="btn alt" onclick="gStop()">В меню</button>';
 return(G.i==0?'<div class="nt"><b>'+esc(e.topic)+'.</b> '+esc(e.rule)+'</div>':'')+'<div class="note">'+(G.i+1)+'/'+e.items.length+'</div><div class="card"><div class="front" style="font-size:24px">'+esc(it.q)+'</div></div><div class="opts">'+it.opts.map((o,i)=>'<button class="opt'+(G.a!=null?(i==it.a?' good':i==G.a?' bad':''):'')+'" onclick="gG('+i+')">'+esc(o)+'</button>').join('')+'</div>'+(G.a!=null?'<div class="nt">'+esc(it.why)+'</div><button class="btn" onclick="gNext()">Дальше</button>':'')+'<button class="btn alt" onclick="gStop()">Выйти</button>'}
var SC=[['Кафе','ordering food and drinks in a cafe; you are the waiter'],['Вокзал','buying a train ticket at the station; you are the ticket clerk'],['Обменник','exchanging money at a currency exchange; you are the clerk'],['Отель','checking in at a hotel; you are the receptionist'],['Аптека','buying medicine at a pharmacy; you are the pharmacist'],['Как пройти','asking a passer-by for directions; you are the passer-by']];
function reEsc(s){return s.replace(/[.*+?^$(){}|[\]\\]/g,'\\$&')}
function vScen(){return'<div class="note">Выбери ситуацию. Claude сыграет роль, а ты ответь на выбранном языке (язык выбирается вверху).</div>'+SC.map((s,i)=>'<button class="btn alt" onclick="gSc('+i+')">'+s[0]+'</button>').join('')+'<button class="btn alt" onclick="gStop()">В меню</button>'}
function gSc(i){G={m:'talk',sc:SC[i][1]};gTalk()}
function gRead(){G.rd=1;G.qs=0;G.L=lang=='all'?'en':lang;G.tg=targets(G.L,6);G.ex=null;G.i=0;G.sc=0;G.a=null;G.busy=1;G.err='';var N=LNN[G.L];
 var p=['Write a short story (5-7 simple sentences, level A2-B1) in '+N+' for a Russian-speaking learner. Use each of these target words at least once, in a natural form: '+G.tg.map(c=>c.f).join(', ')+'.','Then write 3 multiple-choice comprehension questions about the story in '+N+', each with exactly 4 options and one correct answer (vary its position).','Respond with ONLY a JSON object with keys: title, text (the story), forms (array of the exact word forms from the text that correspond to the target words), items (array of objects with keys q, opts, a as the index of the correct option, why as one short sentence in Russian).'].join('\n');
 render();ai(p).then(t=>{var j=jparse(t);if(!j.text||!j.items||!j.items.length)throw 0;j.topic=j.title||'Текст';j.rule='Вопросы к тексту.';G.ex=j;G.busy=0;render()}).catch(e=>{G.err=aerr(e);G.busy=0;render()})}
function vRead(){if(G.busy||G.err||!G.ex||G.qs)return vGram();
 var e=G.ex,fs=(e.forms||[]).filter(Boolean),h=esc(e.text);
 if(fs.length)h=h.replace(new RegExp(fs.map(reEsc).join('|'),'gi'),m=>'<b>'+m+'</b>');
 return'<div class="card" style="text-align:left"><div class="tag '+G.L+'">'+esc(e.title||'')+'</div><p style="margin:12px 0;white-space:pre-line">'+h+'</p><button class="say" onclick="speak(G.ex.text,G.L)">Послушать</button></div><div class="nt">'+G.tg.map(c=>esc(c.f)+' — '+esc(c.b)).join('<br>')+'</div><button class="btn" onclick="G.qs=1;render()">К вопросам</button><button class="btn alt" onclick="gStop()">В меню</button>'}
function newCount(){return S.cards.filter(c=>c.due===0).length}
function hasEx(c){return(c.n||'').split('\n').filter(l=>l&&l.indexOf('Произношение')!=0).length>=3}
var EX={run:0,done:0,tot:0,err:''};
function genEx(cs){var by={};cs.forEach(c=>by[c.id]=c);
 var p=['For each word below, write 3 short natural example sentences in its language (level A2-B1) showing different typical uses or common expressions. After each sentence add a Russian translation in parentheses.','Words (id | language | word | Russian): '+cs.map(c=>c.id+' | '+LNN[c.l]+' | '+c.f+' | '+c.b).join('; '),'Respond with ONLY a JSON object with keys: items (array of objects with keys id and ex, where ex is an array of 3 strings).'].join('\n');
 return ai(p).then(t=>{jparse(t).items.forEach(it=>{var c=by[it.id];if(c&&it.ex&&it.ex.length)c.n=(c.n?c.n+'\n':'')+it.ex.map(x=>'• '+x).join('\n')});save()})}
function oneEx(){genEx([cur]).then(render).catch(e=>alert(aerr(e)))}
function exStop(){EX.stop=1}
function exAll(){if(EX.run)return;var q=pool(c=>!hasEx(c));EX={run:1,done:0,tot:q.length,err:'',stop:0};
 if(!q.length){EX.run=0;EX.err='У всех слов уже есть примеры';render();return}
 var step=()=>{if(EX.stop||!q.length){EX.run=0;render();return}var b=q.splice(0,15);genEx(b).then(()=>{EX.done+=b.length;render();step()}).catch(e=>{EX.run=0;EX.err=aerr(e)+'. Нажми ещё раз, продолжу с оставшихся';render()})};step();render()}
function loadPacks(){S.packs=S.packs||{};PACKS.forEach(function(p){if(S.packs[p[0]])return;S.packs[p[0]]=1;
 parse(p[2]).out.forEach(function(x){var c=S.cards.filter(function(k){return k.l==p[1]&&k.f.toLowerCase()==x[0].toLowerCase()})[0];
  if(!c){S.cards.push(mk(p[1],x[0],x[1],x[2].join('\n')));return}
  if(c.b.toLowerCase().indexOf(x[1].toLowerCase())<0)c.b+='; '+x[1];
  x[2].forEach(function(z){if(c.n.indexOf(z)<0)c.n+=(c.n?'\n':'')+z})})});save()}
load();loadPacks();render();ping();setInterval(function(){ping();if(!cur&&tab=='study')render()},6e4);
